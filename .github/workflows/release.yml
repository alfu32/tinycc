name: native release bundles

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: GitHub Release tag/name to create or update
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  raylib:
    name: Prepare Raylib ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            payload_path: linux/x86_64
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
            payload_path: linux/aarch64
          - target: windows-x86_64
            runner: ubuntu-22.04
            payload_path: windows/x86_64
          - target: windows-aarch64
            runner: ubuntu-22.04
            payload_path: windows/aarch64
          - target: macos-universal
            runner: macos-15
            payload_path: macos/universal
    steps:
      - uses: actions/checkout@v4
      - name: Build or fetch target Raylib payload
        run: bash scripts/prepare-raylib.sh "${{ matrix.target }}" release/raylib
      - name: Archive standalone Raylib payload
        run: |
          mkdir -p dist
          tar -czf "dist/raylib-${{ matrix.target }}.tar.gz" \
            -C release/raylib "${{ matrix.payload_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: raylib-payload-${{ matrix.target }}
          path: dist/raylib-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  unix:
    needs: raylib
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-22.04
          - id: linux-aarch64
            runner: ubuntu-22.04-arm
          - id: macos-x86_64
            runner: macos-15-intel
          - id: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: raylib-payload-*
          path: release/raylib-archives
          merge-multiple: true
      - name: Unpack Raylib payloads for the compiler bundle
        run: |
          mkdir -p release/raylib
          for archive in release/raylib-archives/*.tar.gz; do
            tar -xzf "$archive" -C release/raylib
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test bundle
        env:
          RAYLIB_BUNDLE: ${{ github.workspace }}/release/raylib
        run: bash scripts/package-unix.sh "${{ matrix.id }}" "dist/tinycc-${{ matrix.id }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: tinycc-${{ matrix.id }}
          path: dist/tinycc-${{ matrix.id }}.tar.gz
          if-no-files-found: error

  windows:
    needs: raylib
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            runner: windows-2025
            vc_arch: amd64
            tcc_arch: x86_64
          - id: windows-aarch64
            runner: windows-11-arm
            vc_arch: arm64
            tcc_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: raylib-payload-*
          path: release/raylib-archives
          merge-multiple: true
      - name: Unpack Raylib payloads for the compiler bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/raylib | Out-Null
          Get-ChildItem release/raylib-archives/*.tar.gz | ForEach-Object {
            tar -xzf $_.FullName -C release/raylib
            if ($LASTEXITCODE -ne 0) { throw "Failed to unpack $($_.Name)" }
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSVC and build bundle
        shell: cmd
        env:
          RAYLIB_BUNDLE: ${{ github.workspace }}\release\raylib
        run: |
          for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vc_arch }}
          call scripts\package-windows.cmd ${{ matrix.tcc_arch }} dist\tinycc-${{ matrix.id }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tinycc-${{ matrix.id }}
          path: dist/tinycc-${{ matrix.id }}.zip
          if-no-files-found: error

  publish-github-release:
    needs: [unix, windows, raylib]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 'current'
      - uses: actions/download-artifact@v4
        with:
          pattern: tinycc-*
          path: release/native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: raylib-payload-*
          path: release/raylib-assets
          merge-multiple: true
      - name: Verify downloaded native archives
        run: |
          find release -maxdepth 3 -type f -print | sort
          test -d release/native
          test "$(find release/raylib-assets -maxdepth 1 -name 'raylib-*.tar.gz' | wc -l)" -eq 5
      - name: Build JVM and Python launchers
        run: bash scripts/build-launchers.sh release/native release/assets
      - name: Publish archives to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/assets/* release/raylib-assets/raylib-*.tar.gz --clobber
          else
            gh release create "$TAG" release/assets/* release/raylib-assets/raylib-*.tar.gz --generate-notes
          fi
